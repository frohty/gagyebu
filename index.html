<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>가계부</title>
<style>
  :root{
    --bg:#f5f5f2; --card:#ffffff; --border:#e6e6e1;
    --text:#1a1a1a; --text2:#6b6b66; --muted:#a3a39c;
    --accent:#185fa5; --accent-bg:#e6f1fb;
    --success:#3b6d11; --success-bg:#eaf3de;
    --danger:#a32d2d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:88px; -webkit-tap-highlight-color:transparent;
  }
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px;}
  header h1{font-size:17px;font-weight:600;margin:0;}
  .sub{font-size:13px;color:var(--text2);margin:0;}
  .screen{display:none;padding:0 16px;}
  .screen.active{display:block;}
  .monthnav{display:flex;align-items:center;justify-content:center;gap:20px;margin:4px 0 14px;font-size:14px;font-weight:500;}
  .monthnav button{background:none;border:none;font-size:18px;color:var(--text2);padding:2px 10px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2px 16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);}
  .card > .row:last-child{border-bottom:none;}
  .row .info{flex:1;min-width:0;}
  .row .title{font-size:14px;margin:0;}
  .row .desc{font-size:12px;color:var(--muted);margin:3px 0 0;}
  .amt{font-size:13px;color:var(--text2);white-space:nowrap;}
  .check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:13px;color:transparent;}
  .check.done{background:var(--success-bg);border-color:var(--success-bg);color:var(--success);}
  .iconbtn{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 7px;cursor:pointer;}
  .banner{background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;}
  .progress{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin:8px 0;}
  .progress > div{height:100%;background:var(--accent);}
  .progress.done > div{background:var(--success);}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;font-size:11.5px;color:var(--muted);padding:6px 0;cursor:pointer;}
  .tabbar button.active{color:var(--accent);font-weight:600;}
  .addbtn{position:fixed;right:20px;bottom:88px;width:50px;height:50px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;font-size:24px;line-height:1;
    box-shadow:0 2px 10px rgba(0,0,0,.22);cursor:pointer;}
  .empty{text-align:center;padding:60px 16px 20px;color:var(--muted);font-size:14px;line-height:1.7;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
  .field input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;border:none;}
  .btn-danger{color:var(--danger);}
  input[type=number]{-moz-appearance:textfield;}
</style>
</head>
<body>

<header>
  <h1>가계부</h1>
  <span class="sub" id="screenDate"></span>
</header>

<section id="screen-home" class="screen active"></section>
<section id="screen-transfer" class="screen"></section>
<section id="screen-cards" class="screen"></section>
<section id="screen-deposits" class="screen"></section>
<section id="screen-debts" class="screen"></section>

<button class="addbtn" id="addBtn" style="display:none">+</button>

<nav class="tabbar">
  <button data-tab="home" class="active">홈</button>
  <button data-tab="transfer">이체체크</button>
  <button data-tab="cards">카드지출</button>
  <button data-tab="deposits">저축현황</button>
  <button data-tab="debts">부채현황</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const STORAGE_KEY = 'gagyebu-data';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultData(){
  return {
    transfers: [
      { id: uid(), bank:'우리',   memo:'청약 + 적금',              budget:400000 },
      { id: uid(), bank:'신한',   memo:'청약',                     budget:250000 },
      { id: uid(), bank:'카카오', memo:'계좌 + 적금 + 엄마용돈',   budget:300000 },
      { id: uid(), bank:'외환',   memo:'보험 + 저축보험',          budget:430000 },
      { id: uid(), bank:'토스',   memo:'새마을적금 + 연금저축',    budget:400000 }
    ],
    transferChecks: {},
    transferActuals: {},
    transferBudgets: {},
    transferBudgetEntries: {},
    transferActualEntries: {},
    cards: [
      { id: uid(), name:'롯데카드', fixedItems:[{id:uid(),label:'뮤엠영어',amount:600000,date:null},{id:uid(),label:'상승도장',amount:150000,date:null}], tiers:[{id:uid(),amount:750000,benefit:''}] },
      { id: uid(), name:'iD STATION GS', fixedItems:[{id:uid(),label:'수학학원',amount:400000,date:null},{id:uid(),label:'통신비',amount:120000,date:null}], tiers:[{id:uid(),amount:800000,benefit:'GS칼텍스 주유 할인 15,000→25,000원'}] },
      { id: uid(), name:'토스삼성카드', fixedItems:[
          {id:uid(),label:'위버스마인드',amount:79900,date:null},{id:uid(),label:'대명스테이션',amount:59400,date:null},
          {id:uid(),label:'신한라이프',amount:40192,date:null},{id:uid(),label:'카카오페이손해보험',amount:20124,date:null},
          {id:uid(),label:'메리츠화재',amount:63230,date:null},{id:uid(),label:'KB손해보험',amount:31573,date:null}
        ], tiers:[{id:uid(),amount:600000,benefit:'토스페이·토스쇼핑·온라인 통합 할인한도 1만→2만원, 인앱·디지털콘텐츠 통합 할인한도 5천→7천원'}] },
      { id: uid(), name:'THE iD. PLATINUM', fixedItems:[{id:uid(),label:'티빙',amount:13500,date:null},{id:uid(),label:'카카오 정기결제',amount:6699,date:null}], tiers:[{id:uid(),amount:500000,benefit:'티빙·카카오 정기결제 50% 할인, 스타벅스 할인·라운지 이용'}] },
      { id: uid(), name:'우리 EVERY 1', fixedItems:[], tiers:[] }
    ],
    cardMonthly: {},
    cardEntries: {},
    cardFixedAmounts: {},
    cardTierAmounts: {},
    deposits: [],
    debts: [],
    incomeLog: [],
    incomeSources: [],
    incomeMonthly: {}
  };
}

function parseWonFromLabel(label){
  if(!label) return 0;
  const s = String(label).replace(/,/g, '');
  const manMatch = s.match(/(\d+(?:\.\d+)?)\s*만/);
  if(manMatch) return Math.round(parseFloat(manMatch[1]) * 10000);
  const numMatch = s.match(/(\d+)/g);
  return numMatch ? parseInt(numMatch[numMatch.length - 1], 10) : 0;
}
function migrateState(s){
  if(!s.transferActuals) s.transferActuals = {};
  if(!s.transferBudgets) s.transferBudgets = {};
  if(!s.transferBudgetEntries) s.transferBudgetEntries = {};
  if(!s.transferActualEntries) s.transferActualEntries = {};
  if(!s.cardEntries) s.cardEntries = {};
  if(!s.cardFixedAmounts) s.cardFixedAmounts = {};
  if(!s.cardTierAmounts) s.cardTierAmounts = {};
  const knownFixedBreakdowns = {
    '롯데카드': [['뮤엠영어',600000],['상승도장',150000]],
    'iD STATION GS': [['수학학원',400000],['통신비',120000]],
    '토스삼성카드': [['위버스마인드',79900],['대명스테이션',59400],['신한라이프',40192],['카카오페이손해보험',20124],['메리츠화재',63230],['KB손해보험',31573]],
    'THE iD. PLATINUM': [['티빙',13500],['카카오 정기결제',6699]],
    '우리 EVERY 1': []
  };
  const knownTierBenefits = {
    'iD STATION GS': 'GS칼텍스 주유 할인 15,000→25,000원',
    '토스삼성카드': '토스페이·토스쇼핑·온라인 통합 할인한도 1만→2만원, 인앱·디지털콘텐츠 통합 할인한도 5천→7천원',
    'THE iD. PLATINUM': '티빙·카카오 정기결제 50% 할인, 스타벅스 할인·라운지 이용'
  };
  (s.cards || []).forEach(c => {
    if(!c.fixedItems){
      if(knownFixedBreakdowns[c.name]){
        c.fixedItems = knownFixedBreakdowns[c.name].map(([label,amount]) => ({ id: uid(), label, amount, date: null }));
      } else {
        c.fixedItems = c.fixed ? [{ id: uid(), label: '고정', amount: c.fixed, date: null }] : [];
      }
    } else {
      c.fixedItems.forEach(f => { if(f.date === undefined) f.date = null; });
    }
    if(!c.tiers){
      c.tiers = (c.target != null) ? [{ id: uid(), amount: c.target, benefit: knownTierBenefits[c.name] || '' }] : [];
    }
  });
  if(!s.debts) s.debts = [];
  if(!s.incomeLog) s.incomeLog = [];
  if(!s.incomeSources) s.incomeSources = [];
  if(!s.incomeMonthly) s.incomeMonthly = {};
  if(s.salaryMonthly && Object.keys(s.salaryMonthly).length && !s.incomeSources.some(x => x.name === '급여')){
    const salaryId = uid();
    s.incomeSources.push({ id: salaryId, name: '급여' });
    Object.keys(s.salaryMonthly).forEach(mk => {
      if(!s.incomeMonthly[mk]) s.incomeMonthly[mk] = {};
      s.incomeMonthly[mk][salaryId] = s.salaryMonthly[mk];
    });
  }
  (s.transfers || []).forEach(t => {
    if(t.budget === undefined) t.budget = (t.amount !== undefined ? t.amount : 0);
  });
  (s.deposits || []).forEach(d => {
    if(d.type) return;
    if(d.term !== undefined && d.term !== null){
      d.type = '적금';
      d.openDate = d.startDate;
      d.maturityDate = addMonthsToDate(d.startDate, d.term).toISOString().slice(0,10);
      d.monthlyAmount = parseWonFromLabel(d.amountLabel);
      d.interestRate = 0;
    } else if(/연금|펀드/.test(d.name || '')){
      d.type = '펀드연금';
      d.frequency = '월';
      d.contributionAmount = parseWonFromLabel(d.amountLabel);
      d.openDate = d.startDate;
      d.valuations = d.valuations || [];
    } else {
      d.type = '예금';
      d.openDate = d.startDate;
      d.maturityDate = null;
      d.principalAmount = parseWonFromLabel(d.amountLabel);
      d.interestRate = 0;
    }
  });
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){}
  const d = defaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  return d;
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
const APP_START_MONTH = '2026-09';
let viewMonth = getMonthKey(new Date());
let currentTab = 'home';

function formatWon(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
function getMonthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m] = key.split('-'); return y + '년 ' + parseInt(m,10) + '월'; }
function addMonthsToDate(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d;
}
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }
function monthsBetween(d1, d2){
  let months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
  if(d2.getDate() < d1.getDate()) months -= 1;
  return Math.max(0, months);
}

function savingsProgress(item){
  const open = new Date(item.openDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const maturity = item.maturityDate ? new Date(item.maturityDate + 'T00:00:00') : null;
  const totalMonths = maturity ? monthsBetween(open, maturity) : null;
  let elapsedMonths = monthsBetween(open, today);
  if(totalMonths != null) elapsedMonths = Math.min(elapsedMonths, totalMonths);
  const principal = item.monthlyAmount * elapsedMonths;
  const rate = (item.interestRate || 0) / 100;
  const interest = item.monthlyAmount * rate * (elapsedMonths * (elapsedMonths + 1)) / (2 * 12);
  const diff = maturity ? daysBetween(today, maturity) : null;
  const pct = totalMonths ? Math.min(100, Math.round(elapsedMonths / totalMonths * 100)) : 0;
  return { elapsedMonths, totalMonths, principal, interest, total: principal + interest, diff, pct };
}
function depositProgress(item){
  const open = new Date(item.openDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const maturity = item.maturityDate ? new Date(item.maturityDate + 'T00:00:00') : null;
  const totalDays = maturity ? daysBetween(open, maturity) : null;
  let elapsedDays = daysBetween(open, today);
  if(totalDays != null) elapsedDays = Math.min(elapsedDays, totalDays);
  const rate = (item.interestRate || 0) / 100;
  const interest = item.principalAmount * rate * elapsedDays / 365;
  const diff = maturity ? daysBetween(today, maturity) : null;
  const pct = totalDays ? Math.min(100, Math.round(elapsedDays / totalDays * 100)) : 0;
  return { principal: item.principalAmount, interest, total: item.principalAmount + interest, diff, pct };
}
function fundPeriodsAsOf(item, asOfDate){
  const open = new Date(item.openDate + 'T00:00:00');
  let periods = item.frequency === '주' ? Math.floor(daysBetween(open, asOfDate) / 7) : monthsBetween(open, asOfDate);
  return Math.max(0, periods);
}
function fundPrincipalAsOf(item, asOfDate){
  return item.contributionAmount * fundPeriodsAsOf(item, asOfDate);
}
function getIncomeLogTotal(monthKey){
  return state.incomeLog
    .filter(s => s.date.slice(0,7) === monthKey)
    .reduce((sum, s) => sum + s.amount, 0);
}

function getEffectiveBudget(item, monthKey){
  const entries = (state.transferBudgetEntries[monthKey] || {})[item.id];
  if(entries && entries.length) return entries.reduce((s,e) => s + e.amount, 0);
  const overrides = Object.keys(state.transferBudgets)
    .filter(k => k <= monthKey && state.transferBudgets[k][item.id] !== undefined)
    .sort();
  if(overrides.length) return state.transferBudgets[overrides[overrides.length - 1]][item.id];
  return item.budget;
}
function getActualAmount(item, monthKey){
  const entries = (state.transferActualEntries[monthKey] || {})[item.id];
  if(entries && entries.length) return entries.reduce((s,e) => s + e.amount, 0);
  return (state.transferActuals[monthKey] || {})[item.id];
}
function getFixedItemAmount(item, monthKey){
  const overrides = Object.keys(state.cardFixedAmounts)
    .filter(k => k <= monthKey && state.cardFixedAmounts[k][item.id] !== undefined)
    .sort();
  if(overrides.length) return state.cardFixedAmounts[overrides[overrides.length - 1]][item.id];
  return item.amount;
}
function getTierAmount(tier, monthKey){
  const overrides = Object.keys(state.cardTierAmounts)
    .filter(k => k <= monthKey && state.cardTierAmounts[k][tier.id] !== undefined)
    .sort();
  if(overrides.length) return state.cardTierAmounts[overrides[overrides.length - 1]][tier.id];
  return tier.amount;
}
function getCardTotal(card, monthKey){
  const fixedSum = (card.fixedItems || []).reduce((s,f) => s + getFixedItemAmount(f, monthKey), 0);
  const entries = (state.cardEntries[monthKey] || {})[card.id] || [];
  const countedEntries = entries.filter(e => !e.excluded).reduce((s,e) => s + e.amount, 0);
  return fixedSum + countedEntries;
}
function getCardPaidTotal(card, monthKey){
  const fixedSum = (card.fixedItems || []).reduce((s,f) => s + getFixedItemAmount(f, monthKey), 0);
  const entries = (state.cardEntries[monthKey] || {})[card.id] || [];
  return fixedSum + entries.reduce((s,e) => s + e.amount, 0);
}
function getCardTiers(card, monthKey){
  return (card.tiers || [])
    .map(t => Object.assign({}, t, { amount: getTierAmount(t, monthKey) }))
    .sort((a,b) => a.amount - b.amount);
}
function getCardFinalTarget(card, monthKey){
  const tiers = getCardTiers(card, monthKey);
  return tiers.length ? tiers[tiers.length - 1].amount : null;
}
function getVisibleTransfers(monthKey){
  return state.transfers.filter(t =>
    (!t.createdMonth || t.createdMonth <= monthKey) &&
    (!t.endedMonth || monthKey < t.endedMonth)
  );
}

function shiftMonth(delta){
  const [y,m] = viewMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  const newKey = getMonthKey(d);
  if(newKey < APP_START_MONTH) return;
  viewMonth = newKey;
  render();
}
function renderMonthNav(){
  const atStart = viewMonth <= APP_START_MONTH;
  return `<div class="monthnav">
    <button onclick="shiftMonth(-1)" ${atStart ? 'disabled style="opacity:0.35"' : ''}>‹</button>
    <span>${monthLabel(viewMonth)}</span>
    <button onclick="shiftMonth(1)">›</button>
  </div>`;
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('addBtn').style.display = (tab === 'home' || tab === 'deposits' || tab === 'debts') ? 'none' : 'flex';
  render();
}
document.querySelectorAll('.tabbar button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});
document.getElementById('addBtn').addEventListener('click', () => {
  if(currentTab === 'transfer') openTransferModal(null);
  else if(currentTab === 'cards') openCardModal(null);
});
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
let pendingDelete = null;
function confirmDelete(message, action){
  pendingDelete = action;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <p style="font-size:15px;line-height:1.6;margin:4px 0 20px;">${message}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" style="background:var(--danger);" onclick="executePendingDelete()">삭제</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function executePendingDelete(){
  if(pendingDelete) pendingDelete();
  pendingDelete = null;
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------- HOME ---------- */
function renderHome(){
  const el = document.getElementById('screen-home');
  const monthKey = getMonthKey(new Date());
  const checks = state.transferChecks[monthKey] || {};
  const todoTransfers = getVisibleTransfers(monthKey).filter(t => !checks[t.id]);

  const todoCards = state.cards.filter(c => {
    const finalTarget = getCardFinalTarget(c, monthKey);
    return finalTarget && getCardTotal(c, monthKey) < finalTarget;
  });

  const today = new Date(); today.setHours(0,0,0,0);
  const soonDeposits = state.deposits.filter(d => {
    if(d.matured || !d.maturityDate || (d.type !== '적금' && d.type !== '예금')) return false;
    const maturity = new Date(d.maturityDate + 'T00:00:00');
    const diff = daysBetween(today, maturity);
    return diff >= 0 && diff <= 14;
  });

  const total = todoTransfers.length + todoCards.length + soonDeposits.length;
  let html = '';

  if(total === 0){
    html = `<div class="empty">오늘 할 일 다 끝났어요<br><span style="font-size:12px">완료된 이체와 카드 목표는 각 탭에서 확인할 수 있어요</span></div>`;
  } else {
    html += `<p class="sub" style="margin:8px 0 12px">오늘 할 일 ${total}건</p>`;

    if(todoTransfers.length){
      html += `<div class="card">`;

        html += `<div class="row" onclick="switchTab('transfer')" style="cursor:pointer">
          <div class="info"><p class="title">${t.bank} 이체 아직 안 함</p><p class="desc">${t.memo} · 예산 ${formatWon(getEffectiveBudget(t, monthKey))}</p></div>
        </div>`;

      html += `<div class="card">`;

        const pending = tiers.find(t => cur < t.amount);
        const stageLabel = achieved.length ? `${achieved.length}단계 달성 · ` : '';
        html += `<div class="row" onclick="switchTab('cards')" style="cursor:pointer">
          <div class="info"><p class="title">${c.name} 목표 미달성</p><p class="desc">${stageLabel}${achieved.length + 1}단계까지 ${formatWon(pending.amount - cur)} 남음</p></div>
        </div>`;
      });
      html += `</div>`;
    }
    if(soonDeposits.length){
      html += `<div class="card">`;
      soonDeposits.forEach(d => {
        const maturity = new Date(d.maturityDate + 'T00:00:00');

        html += `<div class="row" onclick="switchTab('deposits')" style="cursor:pointer">
          <div class="info"><p class="title">${d.name} 만기 임박</p><p class="desc">D-${diff}</p></div>
        </div>`;

      html += `</div>`;
    }
  }
  el.innerHTML = html;
}

function saveTransfer(id){
  const bank = document.getElementById('f-bank').value.trim();
  const memo = document.getElementById('f-memo').value.trim();
  const budget = parseInt(document.getElementById('f-budget').value, 10) || 0;
  const actualRaw = document.getElementById('f-actual').value;
  const actual = actualRaw !== '' ? (parseInt(actualRaw, 10) || 0) : null;
  if(!bank){ alert('은행을 입력해줘'); return; }
  let itemId = id;
  if(id){
    const item = state.transfers.find(t => t.id === id);
    item.bank = bank; item.memo = memo;
    if(!state.transferBudgets[viewMonth]) state.transferBudgets[viewMonth] = {};
    state.transferBudgets[viewMonth][id] = budget;
  } else {
    itemId = uid();
    state.transfers.push({ id: itemId, bank, memo, budget, createdMonth: viewMonth });
  }
  if(!state.transferActuals[viewMonth]) state.transferActuals[viewMonth] = {};
  if(actual != null) state.transferActuals[viewMonth][itemId] = actual;
  else delete state.transferActuals[viewMonth][itemId];
  saveState(); closeModal(); render();
}
function deleteTransfer(id){
  confirmDelete('삭제할까요? 이번 달부터 목록에서 빠지고, 이전 달 기록은 그대로 남아요.', () => {
    const item = state.transfers.find(t => t.id === id);
    if(item.createdMonth === viewMonth){
      state.transfers = state.transfers.filter(t => t.id !== id);
    } else {
      item.endedMonth = viewMonth;
    }
    saveState(); closeModal(); render();
  });
}

  let nextCard = null;

  state.cards.forEach((c, i) => {
    const cur = getCardTotal(c, viewMonth);

    html += `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center">

        </div>
      </div>`;

    if(tiers.length){

      html += `<div class="progress ${pct >= 100 ? 'done' : ''}" style="position:relative;">
        <div style="width:${pct}%"></div>
        ${tiers.slice(0,-1).map(t => `<div style="position:absolute;left:${Math.min(100, t.amount/finalTarget*100)}%;top:0;width:2px;height:100%;background:var(--card);"></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">

function saveCardUsage(cardId, entryId){
  const date = document.getElementById('f-cdate').value;

  const memo = document.getElementById('f-cmemo').value.trim();
  const excluded = document.getElementById('f-cexcluded').checked;
  if(!date || amountRaw === ''){ alert('날짜와 금액을 입력해줘'); return; }
  if(!state.cardEntries[viewMonth]) state.cardEntries[viewMonth] = {};
  if(!state.cardEntries[viewMonth][cardId]) state.cardEntries[viewMonth][cardId] = [];
  const list = state.cardEntries[viewMonth][cardId];
  if(entryId){
    const item = list.find(e => e.id === entryId);
    item.date = date; item.amount = parseInt(amountRaw, 10) || 0; item.memo = memo; item.excluded = excluded;

function moveCard(id, delta){
  const idx = state.cards.findIndex(c => c.id === id);
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= state.cards.length) return;
  const arr = state.cards;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  saveState(); render();
}

/* ---------- DEPOSITS (저축현황) ---------- */
function sectionHeader(label, type, opener){
  opener = opener || 'openSavingsModal';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;">
    <span style="font-size:13px;font-weight:500;">${label}</span>

  </div>`;
}
function renderSavingsRow(d, prog){
  let html = `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="title">${d.name}${d.matured ? ' (완료)' : ''}</span>
      <div>
        <button class="iconbtn" onclick="openSavingsModal('${d.type}','${d.id}')">✎</button>
        <button class="iconbtn" onclick="toggleMatured('${d.id}')">${d.matured ? '↺' : '✓'}</button>
      </div>
    </div>`;
  if(prog.diff != null){
    html += `<div class="progress ${prog.diff <= 0 ? 'done' : ''}"><div style="width:${prog.pct}%"></div></div>`;
  }
  const maturityLabel = d.maturityDate ? (prog.diff >= 0 ? `D-${prog.diff}` : '만기 지남') : '만기 없음';
  if(d.type === '적금'){
    html += `<p class="desc">월 ${formatWon(d.monthlyAmount)} · 연 ${d.interestRate || 0}% · ${d.openDate} 개설 · ${d.maturityDate ? d.maturityDate + ' 만기 · ' + maturityLabel : '만기 없음'}</p>`;
  } else {
    html += `<p class="desc">가입 ${formatWon(d.principalAmount)} · 연 ${d.interestRate || 0}% · ${d.openDate} 개설 · ${d.maturityDate ? d.maturityDate + ' 만기 · ' + maturityLabel : '만기 없음'}</p>`;
  }
  if(d.memo) html += `<p class="desc">${d.memo}</p>`;
  html += `<div style="background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px;">`;
  if(d.type === '적금'){
    html += `<p style="font-size:13px;font-weight:500;margin:0;">지금까지 ${formatWon(Math.round(prog.principal))} 납입</p>`;
  }
  html += `<p style="font-size:11px;color:var(--muted);margin:2px 0 0;">세전 예상 총액 약 ${formatWon(Math.round(prog.total))} (이자 약 ${formatWon(Math.round(prog.interest))} 추정)</p>`;
  html += `</div></div>`;
  return html;
}
function renderFundRow(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const principal = fundPrincipalAsOf(d, today);
  let html = `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="title">${d.name}${d.matured ? ' (완료)' : ''}</span>
      <div>
        <button class="iconbtn" onclick="openSavingsModal('펀드연금','${d.id}')">✎</button>
        <button class="iconbtn" onclick="toggleMatured('${d.id}')">${d.matured ? '↺' : '✓'}</button>
      </div>
    </div>
    <p class="desc">${d.frequency} ${formatWon(d.contributionAmount)} · ${d.openDate} 시작 · 누적 납입 ${formatWon(Math.round(principal))}</p>`;
  if(d.memo) html += `<p class="desc">${d.memo}</p>`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
    <span class="desc" style="margin:0">평가금액 기록</span>
    <button class="iconbtn" style="border:0.5px solid var(--border);border-radius:6px;padding:4px 8px;" onclick="openValuationModal('${d.id}')">+ 기록추가</button>
  </div>`;
  const vlist = (d.valuations || []).slice().sort((a,b) => b.date.localeCompare(a.date));
  if(vlist.length){
    html += `<div style="background:var(--bg);border-radius:8px;padding:2px 10px;margin-top:6px;">`;
    vlist.forEach((v,i) => {
      const asOf = new Date(v.date + 'T00:00:00');
      const gain = v.amount - fundPrincipalAsOf(d, asOf);
      const sign = gain >= 0 ? '+' : '';
      html += `<div style="display:flex;justify-content:space-between;padding:8px 0;${i < vlist.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
        <span style="font-size:13px;">${v.date}</span>
        <span style="font-size:13px;">${formatWon(v.amount)}</span>
        <span style="font-size:12px;color:var(--accent);">${sign}${formatWon(gain)}</span>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}
function renderCompletedRow(d){
  let info = '';
  if(d.type === '적금') info = `월 ${formatWon(d.monthlyAmount)} · ${d.openDate} ~ ${d.maturityDate || '만기 없음'}`;
  else if(d.type === '예금') info = `가입 ${formatWon(d.principalAmount)} · ${d.openDate} ~ ${d.maturityDate || '만기 없음'}`;
  else info = `${d.frequency} ${formatWon(d.contributionAmount)} · ${d.openDate}부터`;
  return `<div class="row">
    <div class="info">
      <p class="title">${d.name} <span style="font-size:11px;color:var(--muted);border:0.5px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:4px;">${d.type}</span></p>
      <p class="desc">${info}</p>
    </div>
    <button class="iconbtn" onclick="openSavingsModal('${d.type}','${d.id}')">✎</button>
    <button class="iconbtn" onclick="toggleMatured('${d.id}')">↺</button>
  </div>`;
}
function renderDeposits(){
  const el = document.getElementById('screen-deposits');

  const savingsAll = state.deposits.filter(d => d.type === '적금').map(d => ({ item: d, prog: savingsProgress(d) }));
  const depositsAll = state.deposits.filter(d => d.type === '예금').map(d => ({ item: d, prog: depositProgress(d) }));
  const fundsAll = state.deposits.filter(d => d.type === '펀드연금');

  const savings = savingsAll.filter(x => !x.item.matured);
  const deposits = depositsAll.filter(x => !x.item.matured);
  const funds = fundsAll.filter(d => !d.matured);
  const completed = savingsAll.filter(x => x.item.matured).map(x => x.item)
    .concat(depositsAll.filter(x => x.item.matured).map(x => x.item))
    .concat(fundsAll.filter(d => d.matured));

  const sortFn = (a,b) => {
    const da = a.prog.diff, db = b.prog.diff;
    if(da == null && db == null) return 0;
    if(da == null) return 1;
    if(db == null) return -1;
    return da - db;
  };
  savings.sort(sortFn);
  deposits.sort(sortFn);

  let html = '';
  const allDated = savings.concat(deposits).filter(x => x.prog.diff != null);
  if(allDated.length){
    const nearest = allDated.reduce((a,b) => a.prog.diff <= b.prog.diff ? a : b);
    html += `<div class="banner">
      <div style="display:flex;justify-content:space-between">
        <span>가장 가까운 만기 · ${nearest.item.name}</span><span>D-${nearest.prog.diff}</span>
      </div>
    </div>`;
  }

  html += sectionHeader('적금', '적금');
  html += `<div class="card">`;
  html += savings.length ? savings.map(({item,prog}) => renderSavingsRow(item, prog)).join('') : `<p class="desc" style="padding:12px 0">아직 등록된 적금이 없어요</p>`;
  html += `</div>`;

  html += sectionHeader('예금', '예금');
  html += `<div class="card">`;
  html += deposits.length ? deposits.map(({item,prog}) => renderSavingsRow(item, prog)).join('') : `<p class="desc" style="padding:12px 0">아직 등록된 예금이 없어요</p>`;
  html += `</div>`;

  html += sectionHeader('펀드·연금', '펀드연금');
  html += `<div class="card">`;
  html += funds.length ? funds.map(item => renderFundRow(item)).join('') : `<p class="desc" style="padding:12px 0">아직 등록된 펀드·연금이 없어요</p>`;
  html += `</div>`;

  html += `<p style="font-size:13px;font-weight:500;margin:0 0 8px;">완료</p>`;
  html += `<div class="card">`;
  html += completed.length ? completed.map(d => renderCompletedRow(d)).join('') : `<p class="desc" style="padding:12px 0">완료된 항목이 없어요</p>`;
  html += `</div>`;

  el.innerHTML = html;
}

      ${item ? `<button class="btn btn-danger" onclick="deleteSavings('${id}')">삭제</button>` : ''}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveSavings('${type}', ${item ? `'${id}'` : 'null'})">저장</button>
    </div>`;
  modal.innerHTML = fields;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveSavings(type, id){
  const name = document.getElementById('f-name').value.trim();
  const memo = document.getElementById('f-memo').value.trim();
  if(!name){ alert('이름을 입력해줘'); return; }

  const data = { name, memo };
  const openDate = document.getElementById('f-open').value;
  if(!openDate){ alert('개설일은 필수야'); return; }
  data.openDate = openDate;

  if(type === '적금'){
    data.maturityDate = document.getElementById('f-maturity').value || null;
    data.monthlyAmount = parseInt(document.getElementById('f-monthly').value, 10) || 0;
    data.interestRate = parseFloat(document.getElementById('f-rate').value) || 0;
  } else if(type === '예금'){
    data.maturityDate = document.getElementById('f-maturity').value || null;
    data.principalAmount = parseInt(document.getElementById('f-principal').value, 10) || 0;
    data.interestRate = parseFloat(document.getElementById('f-rate').value) || 0;
  } else {
    data.frequency = document.getElementById('f-frequency').value;
    data.contributionAmount = parseInt(document.getElementById('f-contribution').value, 10) || 0;
  }

  if(id){
    const item = state.deposits.find(d => d.id === id);
    Object.assign(item, data);
  } else {
    data.type = type;
    data.matured = false;
    if(type === '펀드연금') data.valuations = [];
    data.id = uid();
    state.deposits.push(data);
  }
  saveState(); closeModal(); render();
}
function deleteSavings(id){
  confirmDelete('삭제할까요? 되돌릴 수 없어요.', () => {
    state.deposits = state.deposits.filter(d => d.id !== id);
    saveState(); closeModal(); render();
  });
}
function openValuationModal(id){
  const modal = document.getElementById('modalContent');
  const todayStr = new Date().toISOString().slice(0,10);
  modal.innerHTML = `
    <div class="field"><label>확인일</label><input id="f-vdate" type="date" value="${todayStr}"></div>
    <div class="field"><label>평가금액</label><input id="f-vamount" type="number"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveValuation('${id}')">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveValuation(id){
  const date = document.getElementById('f-vdate').value;
  const amountRaw = document.getElementById('f-vamount').value;
  if(!date || amountRaw === ''){ alert('날짜와 금액을 입력해줘'); return; }
  const item = state.deposits.find(d => d.id === id);
  if(!item.valuations) item.valuations = [];
  item.valuations.push({ date, amount: parseInt(amountRaw, 10) || 0 });
  saveState(); closeModal(); render();
}

/* ---------- DEBTS (부채현황) ---------- */
function renderDebtRow(d){
  let html = `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span class="title">${d.name}</span>
      <span style="font-size:11px;color:var(--muted);border:0.5px solid var(--border);border-radius:4px;padding:1px 6px;">상환 ${d.payer}</span>
    </div>`;
  if(d.type === '고정대출'){
    html += `<p class="desc">원금 ${formatWon(d.principal)} · 금리 ${d.interestRate || 0}% · ${d.startDate} 실행 · ${d.maturityDate || '만기 미정'} 만기 · ${d.repaymentType}</p>`;
  } else {
    html += `<p class="desc">한도 ${formatWon(d.limit)} · 금리 ${d.interestRate || 0}% · ${d.startDate} 개설</p>`;
  }
  if(d.memo) html += `<p class="desc">${d.memo}</p>`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
    <span class="desc" style="margin:0">잔액 기록</span>
    <div>
      <button class="iconbtn" onclick="openDebtModal('${d.type}','${d.id}')">✎</button>
      <button class="iconbtn" style="border:0.5px solid var(--border);border-radius:6px;padding:3px 8px;" onclick="openBalanceLogModal('${d.id}')">+ 기록추가</button>
    </div>
  </div>`;
  const logs = (d.balanceLog || []).slice().sort((a,b) => b.date.localeCompare(a.date));
  if(logs.length){
    html += `<p class="desc" style="margin-top:4px;">최근 ${logs[0].date} · ${formatWon(logs[0].amount)}</p>`;
  }
  html += `</div>`;
  return html;
}
function renderDebts(){
  const el = document.getElementById('screen-debts');
  const fixed = state.debts.filter(d => d.type === '고정대출');
  const limit = state.debts.filter(d => d.type === '한도대출');

  let html = sectionHeader('고정대출', '고정대출', 'openDebtModal');
  html += `<div class="card">`;
  html += fixed.length ? fixed.map(renderDebtRow).join('') : `<p class="desc" style="padding:12px 0">아직 등록된 고정대출이 없어요</p>`;
  html += `</div>`;

  html += sectionHeader('한도대출', '한도대출', 'openDebtModal');
  html += `<div class="card">`;
  html += limit.length ? limit.map(renderDebtRow).join('') : `<p class="desc" style="padding:12px 0">아직 등록된 한도대출이 없어요</p>`;
  html += `</div>`;

  el.innerHTML = html;
}
function openIncomeLogModal(id){
  const modal = document.getElementById('modalContent');
  const todayStr = new Date().toISOString().slice(0,10);
  modal.innerHTML = `
    <div class="field"><label>날짜</label><input id="f-sdate" type="date" value="${todayStr}"></div>
    <div class="field"><label>금액</label><input id="f-samount" type="number"></div>
    <div class="field"><label>출처 (메모)</label><input id="f-smemo" placeholder="예: 배우자 입금, 병원비 실비"></div>
    <div class="modal-actions">
      <button class="btn" onclick="openIncomeManageModal()">취소</button>
      <button class="btn btn-primary" onclick="saveIncomeLog()">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveIncomeLog(){
  const date = document.getElementById('f-sdate').value;
  const amountRaw = document.getElementById('f-samount').value;
  const memo = document.getElementById('f-smemo').value.trim();
  if(!date || amountRaw === ''){ alert('날짜와 금액을 입력해줘'); return; }
  state.incomeLog.push({ id: uid(), date, amount: parseInt(amountRaw, 10) || 0, memo });
  saveState(); render(); openIncomeManageModal();
}
function deleteIncomeLog(id){
  confirmDelete('삭제할까요? 되돌릴 수 없어요.', () => {
    state.incomeLog = state.incomeLog.filter(s => s.id !== id);
    saveState(); render(); openIncomeManageModal();
  });
}
function openDebtModal(type, id){
  const item = id ? state.debts.find(d => d.id === id) : null;
  const modal = document.getElementById('modalContent');
  let fields = `<div class="field"><label>이름</label><input id="f-name" value="${item ? item.name : ''}"></div>`;
  if(type === '고정대출'){
    fields += `
      <div class="field"><label>원금</label><input id="f-principal" type="number" value="${item ? item.principal : ''}"></div>
      <div class="field"><label>실행일</label><input id="f-open" type="date" value="${item ? item.startDate : ''}"></div>
      <div class="field"><label>금리(%)</label><input id="f-rate" type="number" step="0.01" value="${item ? item.interestRate : ''}"></div>
      <div class="field"><label>만기일 (없으면 비워두기)</label><input id="f-maturity" type="date" value="${item && item.maturityDate ? item.maturityDate : ''}"></div>
      <div class="field"><label>상환방식</label>
        <select id="f-repayment" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
          <option value="원금+이자 상환" ${item && item.repaymentType === '원금+이자 상환' ? 'selected' : ''}>원금+이자 상환</option>
          <option value="이자만 납부" ${item && item.repaymentType === '이자만 납부' ? 'selected' : ''}>이자만 납부</option>
        </select>
      </div>`;
  } else {
    fields += `
      <div class="field"><label>한도</label><input id="f-limit" type="number" value="${item ? item.limit : ''}"></div>
      <div class="field"><label>개설일</label><input id="f-open" type="date" value="${item ? item.startDate : ''}"></div>
      <div class="field"><label>금리(%)</label><input id="f-rate" type="number" step="0.01" value="${item ? item.interestRate : ''}"></div>`;
  }
  fields += `
    <div class="field"><label>상환자</label>
      <select id="f-payer" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
        <option value="본인" ${item && item.payer === '본인' ? 'selected' : ''}>본인</option>
        <option value="배우자" ${item && item.payer === '배우자' ? 'selected' : ''}>배우자</option>
      </select>
    </div>
    <div class="field"><label>메모</label><input id="f-memo" value="${item ? item.memo : ''}"></div>
    <div class="modal-actions">
      ${item ? `<button class="btn btn-danger" onclick="deleteDebt('${id}')">삭제</button>` : ''}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveDebt('${type}', ${item ? `'${id}'` : 'null'})">저장</button>
    </div>`;
  modal.innerHTML = fields;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveDebt(type, id){
  const name = document.getElementById('f-name').value.trim();
  const openDate = document.getElementById('f-open').value;
  const memo = document.getElementById('f-memo').value.trim();
  const payer = document.getElementById('f-payer').value;
  if(!name || !openDate){ alert('이름과 날짜는 필수야'); return; }

  const data = { name, startDate: openDate, memo, payer };
  data.interestRate = parseFloat(document.getElementById('f-rate').value) || 0;
  if(type === '고정대출'){
    data.principal = parseInt(document.getElementById('f-principal').value, 10) || 0;
    data.maturityDate = document.getElementById('f-maturity').value || null;
    data.repaymentType = document.getElementById('f-repayment').value;
  } else {
    data.limit = parseInt(document.getElementById('f-limit').value, 10) || 0;
  }

  if(id){
    const item = state.debts.find(d => d.id === id);
    Object.assign(item, data);
  } else {
    data.type = type;
    data.id = uid();
    data.balanceLog = [];
    state.debts.push(data);
  }
  saveState(); closeModal(); render();
}
function deleteDebt(id){
  confirmDelete('삭제할까요? 되돌릴 수 없어요.', () => {
    state.debts = state.debts.filter(d => d.id !== id);
    saveState(); closeModal(); render();
  });
}
function openBalanceLogModal(id){
  const modal = document.getElementById('modalContent');
  const todayStr = new Date().toISOString().slice(0,10);
  modal.innerHTML = `
    <div class="field"><label>확인일</label><input id="f-bdate" type="date" value="${todayStr}"></div>
    <div class="field"><label>잔액</label><input id="f-bamount" type="number"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveBalanceLog('${id}')">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveBalanceLog(id){
  const date = document.getElementById('f-bdate').value;
  const amountRaw = document.getElementById('f-bamount').value;
  if(!date || amountRaw === ''){ alert('날짜와 잔액을 입력해줘'); return; }
  const item = state.debts.find(d => d.id === id);
  if(!item.balanceLog) item.balanceLog = [];
  item.balanceLog.push({ date, amount: parseInt(amountRaw, 10) || 0 });
  saveState(); closeModal(); render();
}
