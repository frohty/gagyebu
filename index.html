<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2">
<title>가계부</title>
<style>
  :root{
    --bg:#f5f5f2; --card:#ffffff; --border:#e6e6e1;
    --text:#1a1a1a; --text2:#6b6b66; --muted:#a3a39c;
    --accent:#185fa5; --accent-bg:#e6f1fb;
    --success:#3b6d11; --success-bg:#eaf3de;
    --danger:#a32d2d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:88px; -webkit-tap-highlight-color:transparent;
  }
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px;}
  header h1{font-size:17px;font-weight:600;margin:0;}
  .sub{font-size:13px;color:var(--text2);margin:0;}
  .screen{display:none;padding:0 16px;}
  .screen.active{display:block;}
  .monthnav{display:flex;align-items:center;justify-content:center;gap:20px;margin:4px 0 14px;font-size:14px;font-weight:500;}
  .monthnav button{background:none;border:none;font-size:18px;color:var(--text2);padding:2px 10px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2px 16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);}
  .card > .row:last-child{border-bottom:none;}
  .row .info{flex:1;min-width:0;}
  .row .title{font-size:14px;margin:0;}
  .row .desc{font-size:12px;color:var(--muted);margin:3px 0 0;}
  .amt{font-size:13px;color:var(--text2);white-space:nowrap;}
  .check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:13px;color:transparent;}
  .check.done{background:var(--success-bg);border-color:var(--success-bg);color:var(--success);}
  .iconbtn{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 7px;cursor:pointer;}
  .banner{background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;}
  .progress{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin:8px 0;}
  .progress > div{height:100%;background:var(--accent);}
  .progress.done > div{background:var(--success);}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;font-size:11.5px;color:var(--muted);padding:6px 0;cursor:pointer;}
  .tabbar button.active{color:var(--accent);font-weight:600;}
  .addbtn{position:fixed;right:20px;bottom:88px;width:50px;height:50px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;font-size:24px;line-height:1;
    box-shadow:0 2px 10px rgba(0,0,0,.22);cursor:pointer;}
  .empty{text-align:center;padding:60px 16px 20px;color:var(--muted);font-size:14px;line-height:1.7;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
  .field input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;border:none;}
  .btn-danger{color:var(--danger);}
  input[type=number]{-moz-appearance:textfield;}
</style>
</head>
<body>

<header>
  <h1>가계부</h1>
  <span class="sub" id="screenDate"></span>
</header>

<section id="screen-home" class="screen active"></section>
<section id="screen-transfer" class="screen"></section>
<section id="screen-cards" class="screen"></section>
<section id="screen-deposits" class="screen"></section>

<button class="addbtn" id="addBtn" style="display:none">+</button>

<nav class="tabbar">
  <button data-tab="home" class="active">홈</button>
  <button data-tab="transfer">이체체크</button>
  <button data-tab="cards">카드지출</button>
  <button data-tab="deposits">예금현황</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const STORAGE_KEY = 'gagyebu-data';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultData(){
  return {
    transfers: [
      { id: uid(), bank:'우리',   memo:'청약 + 적금',              amount:400000 },
      { id: uid(), bank:'신한',   memo:'청약',                     amount:250000 },
      { id: uid(), bank:'카카오', memo:'계좌 + 적금 + 엄마용돈',   amount:300000 },
      { id: uid(), bank:'외환',   memo:'보험 + 저축보험',          amount:430000 },
      { id: uid(), bank:'토스',   memo:'새마을적금 + 연금저축',    amount:400000 }
    ],
    transferChecks: {},
    cards: [
      { id: uid(), name:'롯데카드',          fixed:750000,  target:750000 },
      { id: uid(), name:'iD STATION GS',     fixed:520000,  target:800000 },
      { id: uid(), name:'토스삼성카드',      fixed:294419,  target:600000 },
      { id: uid(), name:'THE iD. PLATINUM',  fixed:20199,   target:500000 },
      { id: uid(), name:'우리 EVERY 1',      fixed:0,       target:null }
    ],
    cardMonthly: {},
    deposits: [
      { id: uid(), name:'새마을금고 적금',  amountLabel:'월 30만원',   startDate:'2025-12-01', term:12,   memo:'', matured:false },
      { id: uid(), name:'우리 적금',        amountLabel:'월 30만원',   startDate:'2026-01-01', term:12,   memo:'', matured:false },
      { id: uid(), name:'카카오연금저축',   amountLabel:'월 10만원',   startDate:'2026-01-01', term:null, memo:'24년12월부터 30만원, 26년1월부터 10만원', matured:false },
      { id: uid(), name:'카뱅 자유적금',    amountLabel:'누적 120만원', startDate:'2025-01-30', term:null, memo:'선민 80만 + 현금 30만 + 새마을적금 37만', matured:false },
      { id: uid(), name:'카뱅예금',         amountLabel:'109만원',     startDate:'2026-01-30', term:null, memo:'', matured:false },
      { id: uid(), name:'새마을예금',       amountLabel:'40만원',      startDate:'2026-03-17', term:null, memo:'', matured:false }
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const d = defaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  return d;
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
let viewMonth = getMonthKey(new Date());
let currentTab = 'home';

function formatWon(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
function getMonthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m] = key.split('-'); return y + '년 ' + parseInt(m,10) + '월'; }
function addMonthsToDate(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d;
}
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }

function shiftMonth(delta){
  const [y,m] = viewMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  viewMonth = getMonthKey(d);
  render();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('addBtn').style.display = tab === 'home' ? 'none' : 'flex';
  render();
}
document.querySelectorAll('.tabbar button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});
document.getElementById('addBtn').addEventListener('click', () => {
  if(currentTab === 'transfer') openTransferModal(null);
  else if(currentTab === 'cards') openCardModal(null);
  else if(currentTab === 'deposits') openDepositModal(null);
});
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------- HOME ---------- */
function renderHome(){
  const el = document.getElementById('screen-home');
  const monthKey = getMonthKey(new Date());
  const checks = state.transferChecks[monthKey] || {};
  const todoTransfers = state.transfers.filter(t => !checks[t.id]);

  const cm = state.cardMonthly[monthKey] || {};
  const todoCards = state.cards.filter(c => c.target && ((cm[c.id] ?? c.fixed) < c.target));

  const today = new Date(); today.setHours(0,0,0,0);
  const soonDeposits = state.deposits.filter(d => {
    if(d.matured || !d.term) return false;
    const maturity = addMonthsToDate(d.startDate, d.term);
    const diff = daysBetween(today, maturity);
    return diff >= 0 && diff <= 14;
  });

  const total = todoTransfers.length + todoCards.length + soonDeposits.length;
  let html = '';

  if(total === 0){
    html = `<div class="empty">오늘 할 일 다 끝났어요<br><span style="font-size:12px">완료된 이체와 카드 목표는 각 탭에서 확인할 수 있어요</span></div>`;
  } else {
    html += `<p class="sub" style="margin:8px 0 12px">오늘 할 일 ${total}건</p>`;

    if(todoTransfers.length){
      html += `<div class="card">`;
      todoTransfers.forEach(t => {
        html += `<div class="row" onclick="switchTab('transfer')" style="cursor:pointer">
          <div class="info"><p class="title">${t.bank} 이체 아직 안 함</p><p class="desc">${t.memo} · ${formatWon(t.amount)}</p></div>
        </div>`;
      });
      html += `</div>`;
    }
    if(todoCards.length){
      html += `<div class="card">`;
      todoCards.forEach(c => {
        const cur = cm[c.id] ?? c.fixed;
        const remain = c.target - cur;
        html += `<div class="row" onclick="switchTab('cards')" style="cursor:pointer">
          <div class="info"><p class="title">${c.name} 목표 미달성</p><p class="desc">${formatWon(remain)} 남음</p></div>
        </div>`;
      });
      html += `</div>`;
    }
    if(soonDeposits.length){
      html += `<div class="card">`;
      soonDeposits.forEach(d => {
        const maturity = addMonthsToDate(d.startDate, d.term);
        const diff = daysBetween(today, maturity);
        html += `<div class="row" onclick="switchTab('deposits')" style="cursor:pointer">
          <div class="info"><p class="title">${d.name} 만기 임박</p><p class="desc">D-${diff}</p></div>
        </div>`;
      });
      html += `</div>`;
    }
  }
  el.innerHTML = html;
}

/* ---------- TRANSFER ---------- */
function renderTransfer(){
  const el = document.getElementById('screen-transfer');
  const checks = state.transferChecks[viewMonth] || {};
  const total = state.transfers.reduce((s,t) => s + t.amount, 0);
  const done = state.transfers.filter(t => checks[t.id]).reduce((s,t) => s + t.amount, 0);
  const pct = total ? Math.round(done / total * 100) : 0;

  let html = `<div class="monthnav"><button onclick="shiftMonth(-1)">‹</button><span>${monthLabel(viewMonth)}</span><button onclick="shiftMonth(1)">›</button></div>`;
  html += `<div class="banner">
    <div style="display:flex;justify-content:space-between">
      <span>${formatWon(done)} / ${formatWon(total)} 완료</span><span>${pct}%</span>
    </div>
    <div class="progress ${pct >= 100 ? 'done' : ''}"><div style="width:${pct}%"></div></div>
  </div>`;
  html += `<div class="card">`;
  state.transfers.forEach(t => {
    const on = !!checks[t.id];
    html += `<div class="row">
      <div class="check ${on ? 'done' : ''}" onclick="toggleTransfer('${t.id}')">✓</div>
      <div class="info"><p class="title">${t.bank}</p><p class="desc">${t.memo}</p></div>
      <span class="amt">${formatWon(t.amount)}</span>
      <button class="iconbtn" onclick="openTransferModal('${t.id}')">✎</button>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}
function toggleTransfer(id){
  if(!state.transferChecks[viewMonth]) state.transferChecks[viewMonth] = {};
  state.transferChecks[viewMonth][id] = !state.transferChecks[viewMonth][id];
  saveState(); render();
}
function openTransferModal(id){
  const item = id ? state.transfers.find(t => t.id === id) : null;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="field"><label>은행</label><input id="f-bank" value="${item ? item.bank : ''}"></div>
    <div class="field"><label>내용</label><input id="f-memo" value="${item ? item.memo : ''}"></div>
    <div class="field"><label>금액</label><input id="f-amount" type="number" value="${item ? item.amount : ''}"></div>
    <div class="modal-actions">
      ${item ? `<button class="btn btn-danger" onclick="deleteTransfer('${id}')">삭제</button>` : ''}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveTransfer(${item ? `'${id}'` : 'null'})">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveTransfer(id){
  const bank = document.getElementById('f-bank').value.trim();
  const memo = document.getElementById('f-memo').value.trim();
  const amount = parseInt(document.getElementById('f-amount').value, 10) || 0;
  if(!bank){ alert('은행을 입력해줘'); return; }
  if(id){
    const item = state.transfers.find(t => t.id === id);
    item.bank = bank; item.memo = memo; item.amount = amount;
  } else {
    state.transfers.push({ id: uid(), bank, memo, amount });
  }
  saveState(); closeModal(); render();
}
function deleteTransfer(id){
  if(!confirm('삭제할까요?')) return;
  state.transfers = state.transfers.filter(t => t.id !== id);
  saveState(); closeModal(); render();
}

/* ---------- CARDS ---------- */
function renderCards(){
  const el = document.getElementById('screen-cards');
  const cm = state.cardMonthly[viewMonth] || {};
  let html = `<div class="monthnav"><button onclick="shiftMonth(-1)">‹</button><span>${monthLabel(viewMonth)}</span><button onclick="shiftMonth(1)">›</button></div>`;
  html += `<div class="card">`;
  let nextCard = null;

  state.cards.forEach((c, i) => {
    const cur = cm[c.id] ?? c.fixed;
    if(c.target && cur < c.target && !nextCard) nextCard = c;
    const pct = c.target ? Math.min(100, Math.round(cur / c.target * 100)) : 0;

    html += `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="title">${i+1}. ${c.name}</span>
        <div>
          <button class="iconbtn" onclick="moveCard('${c.id}',-1)">▲</button>
          <button class="iconbtn" onclick="moveCard('${c.id}',1)">▼</button>
          <button class="iconbtn" onclick="openCardModal('${c.id}')">✎</button>
        </div>
      </div>`;
    if(c.target){
      html += `
      <div class="progress ${pct >= 100 ? 'done' : ''}"><div style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <input type="number" value="${cur}" style="width:120px;padding:7px;border:1px solid var(--border);border-radius:6px" onchange="updateCardUsage('${c.id}',this.value)">
        <span class="desc">목표 ${formatWon(c.target)} · ${c.target - cur > 0 ? formatWon(c.target - cur) + ' 남음' : '완료'}</span>
      </div>`;
    } else {
      html += `<p class="desc">목표 없음 · 남는 일반지출</p>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  if(nextCard){
    html += `<div class="banner">다음 지출은 ${nextCard.name}로</div>`;
  }
  el.innerHTML = html;
}
function updateCardUsage(id, val){
  if(!state.cardMonthly[viewMonth]) state.cardMonthly[viewMonth] = {};
  state.cardMonthly[viewMonth][id] = parseInt(val, 10) || 0;
  saveState(); render();
}
function moveCard(id, delta){
  const idx = state.cards.findIndex(c => c.id === id);
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= state.cards.length) return;
  const arr = state.cards;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  saveState(); render();
}
function openCardModal(id){
  const item = id ? state.cards.find(c => c.id === id) : null;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="field"><label>카드명</label><input id="f-name" value="${item ? item.name : ''}"></div>
    <div class="field"><label>고정실적</label><input id="f-fixed" type="number" value="${item ? item.fixed : 0}"></div>
    <div class="field"><label>목표 (없으면 비워두기)</label><input id="f-target" type="number" value="${item && item.target ? item.target : ''}"></div>
    <div class="modal-actions">
      ${item ? `<button class="btn btn-danger" onclick="deleteCard('${id}')">삭제</button>` : ''}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveCard(${item ? `'${id}'` : 'null'})">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveCard(id){
  const name = document.getElementById('f-name').value.trim();
  const fixed = parseInt(document.getElementById('f-fixed').value, 10) || 0;
  const targetRaw = document.getElementById('f-target').value;
  const target = targetRaw ? (parseInt(targetRaw, 10) || 0) : null;
  if(!name){ alert('카드명을 입력해줘'); return; }
  if(id){
    const item = state.cards.find(c => c.id === id);
    item.name = name; item.fixed = fixed; item.target = target;
  } else {
    state.cards.push({ id: uid(), name, fixed, target });
  }
  saveState(); closeModal(); render();
}
function deleteCard(id){
  if(!confirm('삭제할까요?')) return;
  state.cards = state.cards.filter(c => c.id !== id);
  saveState(); closeModal(); render();
}

/* ---------- DEPOSITS ---------- */
function renderDeposits(){
  const el = document.getElementById('screen-deposits');
  const today = new Date(); today.setHours(0,0,0,0);

  const items = state.deposits.map(d => {
    let maturity = null, diff = null, pct = null;
    if(d.term){
      maturity = addMonthsToDate(d.startDate, d.term);
      diff = daysBetween(today, maturity);
      const start = new Date(d.startDate + 'T00:00:00');
      const totalDays = daysBetween(start, maturity) || 1;
      const elapsed = daysBetween(start, today);
      pct = Math.max(0, Math.min(100, Math.round(elapsed / totalDays * 100)));
    }
    return Object.assign({}, d, { maturity, diff, pct });
  }).sort((a,b) => {
    if(a.matured !== b.matured) return a.matured ? 1 : -1;
    if(a.diff == null && b.diff == null) return 0;
    if(a.diff == null) return 1;
    if(b.diff == null) return -1;
    return a.diff - b.diff;
  });

  let html = '';
  const nearest = items.find(d => !d.matured && d.diff != null);
  if(nearest){
    html += `<div class="banner">
      <div style="display:flex;justify-content:space-between">
        <span>가장 가까운 만기 · ${nearest.name}</span><span>D-${nearest.diff}</span>
      </div>
    </div>`;
  }
  html += `<div class="card">`;
  items.forEach(d => {
    html += `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="title">${d.name}${d.matured ? ' (완료)' : ''}</span>
        <div>
          <button class="iconbtn" onclick="openDepositModal('${d.id}')">✎</button>
          <button class="iconbtn" onclick="toggleMatured('${d.id}')">${d.matured ? '↺' : '✓'}</button>
        </div>
      </div>`;
    if(d.term){
      html += `<div class="progress ${d.diff <= 0 ? 'done' : ''}"><div style="width:${d.pct}%"></div></div>`;
    }
    const label = d.term ? (d.diff >= 0 ? `D-${d.diff}` : '만기 지남') : '진행중';
    html += `<p class="desc">${d.amountLabel} · ${d.startDate} 시작${d.term ? ' · ' + d.term + '개월 · ' + label : ' · 만기 없음'}</p>`;
    if(d.memo) html += `<p class="desc">${d.memo}</p>`;
    html += `</div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}
function toggleMatured(id){
  const item = state.deposits.find(d => d.id === id);
  item.matured = !item.matured;
  saveState(); render();
}
function openDepositModal(id){
  const item = id ? state.deposits.find(d => d.id === id) : null;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="field"><label>이름</label><input id="f-name" value="${item ? item.name : ''}"></div>
    <div class="field"><label>금액 표시 (자유 텍스트)</label><input id="f-amountlabel" value="${item ? item.amountLabel : ''}"></div>
    <div class="field"><label>시작일</label><input id="f-start" type="date" value="${item ? item.startDate : ''}"></div>
    <div class="field"><label>기간(개월, 만기 없으면 비워두기)</label><input id="f-term" type="number" value="${item && item.term ? item.term : ''}"></div>
    <div class="field"><label>메모</label><input id="f-memo" value="${item ? item.memo : ''}"></div>
    <div class="modal-actions">
      ${item ? `<button class="btn btn-danger" onclick="deleteDeposit('${id}')">삭제</button>` : ''}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveDeposit(${item ? `'${id}'` : 'null'})">저장</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function saveDeposit(id){
  const name = document.getElementById('f-name').value.trim();
  const amountLabel = document.getElementById('f-amountlabel').value.trim();
  const startDate = document.getElementById('f-start').value;
  const termRaw = document.getElementById('f-term').value;
  const term = termRaw ? (parseInt(termRaw, 10) || null) : null;
  const memo = document.getElementById('f-memo').value.trim();
  if(!name || !startDate){ alert('이름과 시작일은 필수야'); return; }
  if(id){
    const item = state.deposits.find(d => d.id === id);
    item.name = name; item.amountLabel = amountLabel; item.startDate = startDate; item.term = term; item.memo = memo;
  } else {
    state.deposits.push({ id: uid(), name, amountLabel, startDate, term, memo, matured: false });
  }
  saveState(); closeModal(); render();
}
function deleteDeposit(id){
  if(!confirm('삭제할까요?')) return;
  state.deposits = state.deposits.filter(d => d.id !== id);
  saveState(); closeModal(); render();
}

/* ---------- INIT ---------- */
function updateDateLabel(){
  const d = new Date();
  document.getElementById('screenDate').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}
function render(){
  updateDateLabel();
  renderHome();
  renderTransfer();
  renderCards();
  renderDeposits();
}
render();
</script>
</body>
</html>
